5.1 Training Requirements Overview
All personnel operating under the FROGS Program must complete mandatory training before deployment.
Training is divided into:
•	Core Training
•	Safety Training
•	Elder Protection Training
•	Cultural Competency Training
•	ICS/NIMS Training
•	Leadership Training (for supervisors)
5.2 Mandatory Core Training (All Personnel)
Required Courses
1.	FROGS Core Operations Training
o	Program overview
o	Activation workflow
o	Procurement basics
o	Reporting requirements
o	Compliance rules
2.	Safety & PPE Training
o	PPE use
o	Field safety
o	Hazard identification
o	Incident safety protocols
3.	Elder Protection Training
o	Elder rights
o	Cultural respect
o	Consent rules
o	Mandatory reporting
o	Advocate coordination
4.	Cultural Competency Training
o	Tribal cultural norms
o	Respect protocols
o	Ceremonial item protection
o	Cultural liaison coordination
Upload Requirements
Personnel must upload:
•	Certificate of completion
•	Date completed
•	Trainer name
•	Training provider
5.3 ICS/NIMS Training Requirements
Required for All Personnel
•	ICS 100: Introduction to ICS
•	ICS 200: Basic ICS for Initial Response
Required for Leadership
•	ICS 300: Intermediate ICS
•	ICS 400: Advanced ICS (recommended)
Upload Requirements
Personnel must upload:
•	ICS certificates
•	FEMA SID number
•	Completion date
5.4 Leadership Training Requirements
Required for:
•	Supervisors
•	Team leads
•	Section chiefs
•	Command staff
Leadership Courses
•	FROGS Leadership Operations
•	ICS 300
•	Cultural Safety Leadership
•	Elder Protection Leadership
•	Field Command & Communications
Upload Requirements
•	Certificates
•	Leadership designation form
