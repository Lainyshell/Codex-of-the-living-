SECTION 3 — PROCUREMENT & FINANCE
Verdigris Botanica Tribal Nation Trust
FROGS Program — Operational Onboarding Packet
3.0 Purpose of This Section
This section defines:
•	How agencies request purchases
•	How purchases are approved
•	How money moves
•	How RRPA emergency procurement works
•	How CLINs are mapped
•	How receipts are uploaded
•	How Treasury enforces dual control
•	How compliance monitors procurement
•	How audits verify financial integrity
This is the financial backbone of the FROGS Program.
3.1 Procurement Overview
The FROGS Program uses a single procurement workflow for all purchases.
Procurement authority:
•	Program Director → up to $100,000
•	Program Executive → unlimited
Treasury authority:
•	Executes payments
•	Enforces dual control
•	Verifies bond compliance
•	Reconciles ledgers
Compliance authority:
•	Reviews procurement uploads
•	Flags irregularities
•	Initiates corrective action
•	Triggers audits
3.2 Procurement Workflow (Step by Step)
STEP 1 — Procurement Request Submitted
Agency submits:
•	Procurement Request Form
•	CLIN mapping
•	Vendor information
•	Estimated cost
STEP 2 — Approval
Program Director reviews:
•	CLIN alignment
•	Cost reasonableness
•	Vendor legitimacy
•	Operational necessity
Approval issued via:
•	Procurement Approval Notice
STEP 3 — Purchase
Agency purchases item(s) using:
•	Agency funds (reimbursed)
•	Direct Treasury payment
•	RRPA (if emergency)
STEP 4 — Receipt Upload
Agency uploads:
•	Receipt
•	Invoice
•	Delivery confirmation (if applicable)
•	CLIN mapping
Upload deadline:
•	72 hours
STEP 5 — Treasury Reconciliation
Treasury:
•	Verifies receipt
•	Confirms CLIN
•	Executes payment
•	Updates ledger
STEP 6 — Compliance Review
Compliance:
•	Reviews documentation
•	Flags issues
•	Requests corrections
•	Initiates audit if needed
