4.9 Complaint Intake Workflow
Complaints may be submitted via:
•	Hotline
•	Portal
•	In person
•	Written submission
•	Third party referral
Complaint Categories
•	Category 1: Critical Incident
•	Category 2: Serious Concern
•	Category 3: Operational Issue
•	Category 4: General Feedback
Complaint Workflow (Step by Step)
STEP 1 — Receive Complaint
Agency logs:
