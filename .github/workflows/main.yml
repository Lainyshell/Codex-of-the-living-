•	Policy violations
STEP 6 — Findings Report
Compliance issues:
•	Findings
•	Required corrective action
•	Personnel recommendations
STEP 7 — Enforcement
If severe:
•	Suspension
•	Removal
•	Bond execution
•	Referral
7.4 Forensic Audit Workflow (Step by Step)
Forensic audits are initiated when harm or fraud is suspected.
STEP 1 — Forensic Audit Notice
Issued by:
•	Program Executive
•	Compliance
STEP 2 — Full Access Granted
Compliance receives access to:
•	Logs
•	Receipts
•	Communications
•	Personnel records
•	Vendor records
•	Financial records
STEP 3 — Evidence Collection
Compliance collects:
•	Documents
•	Statements
•	Digital logs
•	Vendor confirmations
STEP 4 — Analysis
Compliance analyzes:
•	Intent
•	Negligence
•	Harm
•	Fraud
•	Misuse
STEP 5 — Findings Report
Includes:
•	Violations
•	Evidence
•	Harm assessment
•	Recommended enforcement
STEP 6 — Enforcement
May include:
•	Suspension
•	Removal
•	Bond execution
•	Criminal referral
STEP 7 — Remediation
Agency must:
•	Correct systems
•	Retrain personnel
•	Update procedures
7.5 Corrective Action Workflow
STEP 1 — Corrective Action Notice
Compliance issues:
•	Required corrections
•	Deadlines
•	Upload requirements
STEP 2 — Agency Response
Agency uploads:
•	Corrective action plan
•	Updated procedures
•	Retraining documentation
STEP 3 — Compliance Review
Compliance verifies:
•	Completeness
•	Accuracy
•	Effectiveness
STEP 4 — Follow Up
Compliance conducts:
•	30 day review
•	60 day review (if needed)
STEP 5 — Closure
Corrective action closed when:
•	All requirements met
•	No further violations detected
7.6 Bond Execution Protocol
Bond execution occurs when:
•	Fraud confirmed
•	Elder harm confirmed
•	Misuse of funds confirmed
•	Intentional violation confirmed
•	Severe negligence confirmed
Bond Execution Workflow
STEP 1 — Violation Confirmed
Compliance confirms:
•	Harm
•	Fraud
•	Misuse
•	Intent
STEP 2 — Bond Execution Notice
Issued by:
•	Program Executive
•	Treasury
STEP 3 — Treasury Action
Treasury:
•	Executes bond
•	Recovers funds
•	Updates ledger
STEP 4 — Agency Notification
Agency receives:
•	Execution summary
•	Required remediation
STEP 5 — Compliance Follow Up
Compliance verifies:
•	Remediation
•	Personnel changes
•	Procedure updates
7.7 Compliance Violations
Minor Violations
Examples:
•	Late uploads
•	Missing documents
•	Incorrect CLIN mapping
Consequences:
•	Warning
•	Retraining
•	30 day follow up
Moderate Violations
Examples:
•	Repeated late uploads
•	Repeated missing documents
•	Incorrect procurement
Consequences:
•	Suspension
•	Corrective action
•	60 day follow up
Major Violations
Examples:
•	Elder harm
•	Fraud
•	Misuse of funds
•	Unauthorized procurement
•	Data breach
•	Mandatory reporting failure
Consequences:
•	Suspension
•	Removal
•	Bond execution
•	Criminal referral
7.8 Agency Standing Requirements
Agencies remain in good standing if:
•	All uploads are timely
•	All procurement is compliant
•	All elder protection rules followed
•	All safety rules followed
•	All data protection rules followed
•	All audits passed
•	No major violations occur
Agencies lose standing if:
•	Major violation occurs
•	Repeated moderate violations occur
•	Audit failure occurs
•	Bond executed
