SECTION 4 — ELDERS & COMMUNITY PROTECTION
Verdigris Botanica Tribal Nation Trust
FROGS Program — Operational Onboarding Packet
4.0 Purpose of This Section
This section defines:
•	How elders and vulnerable adults must be protected
•	How cultural consent must be obtained
•	How mandatory reporting works
•	How community engagement is conducted
•	How complaints are received, categorized, investigated, and resolved
•	How agencies maintain compliance with human protection standards
This is the human safety backbone of the FROGS Program.
4.1 Elders’ Protection Overview
The FROGS Program uses a single, mandatory protection protocol for:
•	Elders (age 60+)
•	Cultural elders (any age, designated by the Trust)
•	Vulnerable adults
•	Cultural stewards
Elders’ Advocate Requirement
Every activation involving elders must include a designated Elders’ Advocate.
The Advocate has:
•	Stop work authority
•	Consent authority
•	Cultural protection authority
•	Safety oversight authority
4.2 Elders’ Protection Workflow (Step by Step)
STEP 1 — Identification
Agency identifies:
•	Elder
•	Cultural elder
•	Vulnerable adult
•	Cultural steward
STEP 2 — Advocate Assignment
Agency assigns:
•	Elders’ Advocate
•	Cultural Liaison (if applicable)
Upload:
•	Advocate assignment form
•	Cultural liaison assignment form
STEP 3 — Consent
Advocate obtains:
•	Informed consent
•	Cultural consent
•	Voluntary agreement
Upload:
•	Consent form
•	Cultural notes
STEP 4 — Safety Assessment
Advocate conducts:
•	Physical safety check
•	Emotional safety check
•	Cultural safety check
•	Environmental safety check
Upload:
•	Safety assessment form
STEP 5 — Protection Actions
Advocate ensures:
•	Privacy
•	Respect
•	Comfort
•	Cultural appropriateness
•	No coercion
•	No separation from caregivers unless required
STEP 6 — Documentation
Agency uploads:
•	Elder intake form
•	Consent form
•	Safety assessment
•	Cultural notes
•	Daily elder protection summary
STEP 7 — Follow Up
Advocate conducts:
•	4 hour check ins
•	Daily documentation
•	End of day summary
