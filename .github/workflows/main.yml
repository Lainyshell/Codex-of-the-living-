3.8 Treasury Workflow
Treasury Responsibilities
•	Execute payments
•	Enforce dual control
•	Verify bond compliance
•	Maintain ledger
•	Reconcile receipts
•	Support audits
Treasury Workflow (Step by Step)
STEP 1 — Receive Documentation
Treasury receives:
•	Procurement Approval Notice
•	Receipt
•	Invoice
•	CLIN mapping
STEP 2 — Verify Documentation
Treasury verifies:
•	CLIN accuracy
•	Vendor legitimacy
•	Receipt authenticity
•	Approval validity
STEP 3 — Execute Payment
Payment executed via:
•	ACH
•	Vendor direct pay
•	Reimbursement
STEP 4 — Dual Control Enforcement
Payments > $50,000 require:
•	Treasury signature
•	Program Executive signature
STEP 5 — Ledger Update
Treasury updates:
•	CLIN totals
•	Incident totals
•	Monthly ledger
STEP 6 — Monthly Reconciliation
Treasury reconciles:
•	All receipts
•	All RRPA actions
•	All CLIN totals
3.9 Compliance Workflow
Compliance Responsibilities
•	Review procurement uploads
•	Verify RRPA justification
•	Flag irregularities
•	Request corrections
•	Initiate audits
•	Enforce corrective action
Compliance Workflow (Step by Step)
STEP 1 — Receive Uploads
Compliance receives:
•	Receipts
•	Invoices
•	CLIN mapping
•	RRPA documentation
STEP 2 — Review
Compliance checks:
•	Accuracy
•	Completeness
•	Legitimacy
•	CLIN alignment
STEP 3 — Flag Issues
Compliance flags:
•	Missing receipts
•	Incorrect CLINs
•	Suspicious vendors
•	Duplicate purchases
•	Excessive costs
STEP 4 — Corrective Action
Agency must:
•	Upload missing documents
•	Correct CLIN mapping
•	Provide justification
•	Replace vendor
STEP 5 — Audit Trigger
Audit triggered if:
•	Elder harm
•	Fraud
•	Misuse of funds
•	Unauthorized procurement
•	Data breach
