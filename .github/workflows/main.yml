3.5 CLIN Rules
CLIN Categories
•	CLIN 1000–1999: Personnel
•	CLIN 2000–2999: Equipment
•	CLIN 3000–3999: Supplies
•	CLIN 4000–4999: Transportation
•	CLIN 5000–5999: Facilities
•	CLIN 6000–6999: Communications
•	CLIN 7000–7999: Elder Protection
•	CLIN 8000–8999: Community Stabilization
•	CLIN 9000–9999: Miscellaneous
CLIN Rules
•	Every purchase must map to a CLIN
•	CLIN must match operational need
•	Restricted CLINs require Program Executive approval
•	Prohibited CLINs cannot be purchased
CLIN Upload Requirements
•	CLIN mapping
•	Receipt
•	Invoice
•	Delivery confirmation (if applicable)
3.6 RRPA Emergency Procurement
RRPA = Rapid Response Procurement Authority
Used when:
•	Immediate purchase required
•	Life safety at risk
•	Elder protection required
•	Stabilization needed
•	Delay would cause harm
RRPA Workflow (Step by Step)
STEP 1 — RRPA Justification Submitted
Agency submits:
•	RRPA Justification Form
•	CLIN mapping
•	Vendor info
•	Estimated cost
STEP 2 — Immediate Approval
Program Director approves within:
•	15 minutes (target)
•	1 hour (maximum)
STEP 3 — Purchase
Agency purchases item(s) immediately.
STEP 4 — Receipt Upload
Agency uploads:
•	Receipt
•	Invoice
•	CLIN mapping
Upload deadline:
•	72 hours
STEP 5 — Compliance Review
Compliance verifies:
•	Valid justification
•	Receipt accuracy
•	CLIN alignment
STEP 6 — Treasury Payment
Treasury executes payment.
