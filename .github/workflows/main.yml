2.4 Deployment Workflow
Deployment Timeline
•	0–2 hours: Agency acknowledgment
•	2–4 hours: Personnel mobilization
•	4–8 hours: Arrival on site
•	8–12 hours: Full operational capability
Deployment Requirements
Agencies must deploy:
•	Credentialed personnel
•	Required equipment
•	Communications capability
•	Safety equipment
•	Elders’ Advocate (if elders involved)
Deployment Uploads
•	Deployment roster
•	Equipment list
•	Communications plan
•	Safety plan
2.5 Resource Typing & Team Assignment
Team Levels
•	Level 1: Full incident response (12 personnel)
•	Level 2: Stabilization team (6 personnel)
•	Level 3: Rapid triage team (3 personnel)
•	Level 4: Elder protection team (1–2 personnel)
Personnel Types
•	Type 1: Command
•	Type 2: Leadership
•	Type 3: Response
•	Type 4: Elder protection
•	Type 5: Logistics
Equipment Types
•	Type 1: Command unit
•	Type 2: Response vehicle
•	Type 3: Stabilization kit
•	Type 4: Elder protection kit
•	Type 5: Communications kit
Assignment Rules
•	Team level determined by Task Order
•	Personnel must match required types
•	Equipment must match required types
•	Elders’ Advocate required if elders involved
2.6 Field Operations Protocol
Operational Priorities
1.	Life safety
2.	Elder protection
3.	Stabilization
4.	Logistics
5.	Communications
6.	Documentation
Field Requirements
•	PPE worn at all times
•	Communications active
•	Safety checks hourly
•	Elder protection checks every 4 hours
•	Documentation uploaded daily
Field Uploads
•	Daily operations summary
•	Daily safety report
•	Daily elder protection report
•	Daily procurement summary
2.7 Communications Protocol
Required Communications
•	Primary radio
•	Backup radio
•	Satellite (if available)
•	Secure messaging app
•	Daily communications check
Communications Uploads
•	Communications plan
•	Daily communications log
2.8 Logistics Protocol
Logistics Responsibilities
•	Transport
•	Supply
•	Equipment
•	Facilities
•	Staging
•	Resupply
Logistics Uploads
•	Equipment list
•	Supply list
•	Resupply requests
2.9 Daily Reporting Requirements
Agencies must upload:
Daily
•	Operations summary
•	Procurement summary
•	Elder protection summary
•	Safety report
Within 24 hours
•	Incident report (if applicable)
•	Mandatory reporting (if elder/vulnerable adult involved)
2.10 Closeout Workflow
STEP 1 — Operations End
Field teams demobilize.
STEP 2 — Documentation Upload
Agency uploads:
•	Incident report
•	Procurement receipts
•	RRPA documentation
•	Elder protection documentation
•	Safety closeout
•	AAR (if required)
STEP 3 — Financial Reconciliation
Treasury reconciles:
•	CLIN totals
•	Receipts
•	RRPA actions
STEP 4 — Compliance Review
Compliance verifies:
•	Documentation completeness
•	Elder protection compliance
•	Procurement compliance
STEP 5 — Audit (if triggered)
Audit initiated only if:
•	Elder harm
•	Fraud
•	Misuse of funds
•	Unauthorized procurement
•	Data breach
