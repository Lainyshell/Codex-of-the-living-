6.5 Breach Response Protocol
A breach includes:
•	Unauthorized access
•	Unauthorized data sharing
•	Lost device
•	Compromised credentials
•	Malware infection
•	System intrusion
Breach Response Workflow (Step by Step)
STEP 1 — Detection
Any personnel detecting a breach must report it within 1 hour.
STEP 2 — Containment
Agency must:
•	Disable affected accounts
•	Lock affected systems
•	Isolate compromised devices
•	Stop data flow
STEP 3 — Notification
Agency must notify:
•	Program Executive
•	Data Protection Lead
•	Compliance
•	Treasury (if financial data involved)
Notification deadline:
•	Within 4 hours
STEP 4 — Forensic Review
Data Protection Lead initiates:
•	Log analysis
•	Access review
•	System scan
•	Impact assessment
STEP 5 — Remediation
Actions may include:
•	Password resets
•	MFA resets
•	System patching
•	Device replacement
•	Data restoration
STEP 6 — Compliance Action
Compliance determines:
•	Negligence
•	Intent
•	Severity
•	Required corrective action
STEP 7 — Reporting
Agency uploads:
•	Breach report
•	Remediation plan
•	Forensic summary
6.6 Breach Report Form (Fill Ready)
BREACH REPORT — FROGS PROGRAM
