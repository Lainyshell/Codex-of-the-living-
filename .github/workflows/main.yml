SECTION 6 — DATA PROTECTION & PRIVACY
Verdigris Botanica Tribal Nation Trust
FROGS Program — Operational Onboarding Packet
6.0 Purpose of This Section
This section defines:
•	Sovereign data ownership
•	Data protection requirements
•	Access control rules
•	Encryption standards
•	Breach response workflow
•	Data retention schedule
•	Confidentiality requirements
•	Upload requirements
•	Compliance enforcement
This is the information security backbone of the FROGS Program.
6.1 Sovereign Data Ownership
All data collected, stored, transmitted, or processed under the FROGS Program is:
•	Sovereign property of the Verdigris Botanica Tribal Nation Trust
•	Protected under tribal law
•	Not subject to federal or state seizure
•	Not accessible without VBTT authorization
•	Not shareable without MOU or contract
This applies to:
•	Personnel data
•	Elder protection data
•	Incident data
•	Procurement data
•	Financial data
•	Cultural data
•	Complaint data
•	Audit data
Agencies must acknowledge sovereign data ownership during onboarding.
6.2 Data Protection Requirements
Agencies must comply with the following minimum standards:
Encryption
•	AES 256 encryption at rest
•	TLS 1.2+ encryption in transit
Access Control
•	Role based access
•	Least privilege principle
•	Multi factor authentication
•	Access logs retained for 7 years
Credentialing
•	Unique user accounts
•	No shared accounts
•	No generic accounts
•	No personal email access
Monitoring
•	Access logs
•	Upload logs
•	Modification logs
•	Deletion logs
Storage
•	Secure servers
•	Encrypted drives
•	No local storage
•	No personal devices
6.3 Access Control Workflow (Step by Step)
STEP 1 — Access Request Submitted
Agency submits:
•	Access Request Form
•	Personnel credential
•	Role designation
STEP 2 — Verification
Program verifies:
•	Credential validity
•	Role alignment
•	Training completion
STEP 3 — Access Granted
Program grants:
•	Portal access
•	Role based permissions
•	MFA setup
STEP 4 — Logging Begins
System logs:
•	Access events
•	Uploads
•	Modifications
•	Downloads
STEP 5 — Quarterly Review
Compliance reviews:
•	Access logs
•	Role appropriateness
•	Credential status
STEP 6 — Access Revocation
Access revoked if:
•	Credential expires
•	Personnel leaves agency
•	Compliance violation occurs
