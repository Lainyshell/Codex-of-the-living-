SECTION 2 — ACTIVATION & OPERATIONS
Verdigris Botanica Tribal Nation Trust
FROGS Program — Operational Onboarding Packet
2.0 Purpose of This Section
This section defines:
•	How activations begin
•	How Task Orders are issued
•	How deployments are structured
•	How teams are assigned
•	How operations flow
•	How reporting works during activation
•	How closeout works
This is the core operational workflow for agencies.
2.1 Activation Overview
The FROGS Program uses a single activation workflow for all incidents.
Activation is triggered by:
•	Crisis or emergency
•	Elder or vulnerable adult risk
•	Community destabilization
•	Request for assistance
•	Program Executive directive
Activation authority:
•	Program Director (up to $500,000)
•	Program Executive (unlimited)
2.2 Activation Workflow (Step by Step)
STEP 1 — Trigger Identified
•	Crisis detected
•	Request received
•	Elder risk reported
•	Community destabilization confirmed
STEP 2 — Activation Decision
Program Director evaluates:
•	Severity
•	Scope
•	Resource needs
•	Agency availability
STEP 3 — Activation Notice Issued
Sent to:
•	Agency leadership
•	Operations Chief
•	Elders’ Advocate
•	Logistics Chief
•	Treasury
•	Compliance
STEP 4 — Task Order Issued
Task Order includes:
•	Incident name
•	Activation date/time
•	Authorized CLINs
•	Funding ceiling
•	Deployment timeline
•	Required uploads
•	Assigned agency
•	Required personnel
•	Required equipment
STEP 5 — Agency Acknowledgment
Agency must acknowledge Task Order within 2 hours.
STEP 6 — Deployment
Deployment must begin within 4 hours of acknowledgment.
STEP 7 — Operations Begin
Field teams initiate:
•	Stabilization
•	Elder protection
•	Logistics
•	Communications
•	Community support
STEP 8 — Reporting Begins
Agency uploads:
•	Daily operations summary
•	Daily procurement summary
•	Daily elder protection summary
•	Safety reports
STEP 9 — Closeout
Agency uploads:
•	Incident report
•	Procurement receipts
•	RRPA documentation
•	Elder protection documentation
•	Safety closeout
•	AAR (if required)
2.3 Task Order Template (Fill Ready)
