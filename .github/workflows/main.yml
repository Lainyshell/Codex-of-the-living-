PIECE 1 — OPERATIONS ONBOARDING WORKBOOK
SECTION 1 — AGENCY REQUIREMENTS & UPLOADS
Verdigris Botanica Tribal Nation Trust
FROGS Program — Operational Onboarding Packet
1.0 Purpose of This Workbook Section
This section defines everything an agency must upload, everything an agency must maintain, and everything an agency must comply with in order to operate under the FROGS Program.
It is designed to be:
•	simple
•	clear
•	fast
•	buildable
•	operational
•	compliance ready
•	audit ready
This is the first document an agency receives during onboarding.
1.1 Required Agency Uploads (Initial Onboarding)
Every agency must upload the following documents before activation:
Identity & Authority
•	Agency legal name
•	UEI number
•	CAGE code
•	EIN
•	Primary physical address
•	Primary mailing address
•	Authorized official name & title
•	Authorized official government ID (front + back)
Compliance & Ethics
•	Signed Accountability Bond Agreement
•	Signed Oath of Service (all personnel)
•	Background checks (all personnel)
•	Signed Non Retaliation Policy
•	Signed Elders’ Protection Compliance Statement
Operational Readiness
•	Personnel roster
•	Credentialing certificates
•	ICS/NIMS certificates
•	Elders’ Protection training certificates
•	Cultural competency certificates
•	Safety/PPE training certificates
Financial & Procurement
•	W 9
•	Banking information (ACH form)
•	Procurement officer designation
•	Treasury liaison designation
Insurance & Liability
•	General liability certificate
•	Workers’ compensation certificate
•	Vehicle insurance (if applicable)
Technology & Communications
•	Communications officer designation
•	Emergency contact list
•	Secure email address for uploads
1.2 Required Agency Uploads (Ongoing)
Weekly
•	Weekly Operations Summary
•	Weekly Procurement Summary
•	Weekly Elder Protection Summary
Monthly
•	Ledger reconciliation
•	Personnel changes
•	Credentialing updates
•	Complaint intake log
Per Activation
•	Task Order acknowledgment
•	Deployment roster
•	Procurement receipts
•	RRPA justification (if used)
•	Safety report
•	Elder protection documentation
Per Incident
•	Incident report
•	Mandatory reporting (if elder/vulnerable adult involved)
•	Closeout documentation
1.3 Upload Locations
Agencies must upload documents to the following secure portals:
Credentialing Portal
Used for:
•	Personnel documents
•	Training certificates
•	Background checks
•	Oaths
•	Credential renewals
Procurement Portal
Used for:
•	Procurement requests
•	Receipts
•	RRPA documentation
•	CLIN mapping
•	Vendor invoices
Operations Portal
Used for:
•	Weekly summaries
•	Deployment rosters
•	Incident reports
•	Safety reports
•	Elder protection documentation
Compliance Portal
Used for:
•	Complaints
•	Mandatory reporting
•	Audit documentation
•	Corrective action uploads
1.4 Upload Deadlines
Initial Onboarding
All onboarding uploads must be completed before activation.
Weekly Uploads
Due every Friday by 5 PM EST.
Monthly Uploads
Due on the 5th of each month.
Activation Uploads
Due within 24 hours of Task Order issuance.
Procurement Uploads
Receipts and documentation must be uploaded within 72 hours.
RRPA Uploads
Justification + receipt must be uploaded within 72 hours.
Incident Uploads
Incident reports must be uploaded within 24 hours.
Mandatory Reporting
Must be uploaded within 2 hours.
1.5 Compliance Requirements
Agencies must comply with:
•	Procurement SOP
•	RRPA SOP
•	Elders’ Protection Protocol
•	Safety Protocol
•	Mandatory Reporting Protocol
•	Data Protection Policy
•	Audit & Forensic Protocol
•	Non Retaliation Policy
•	Community Engagement Framework
Failure to comply triggers:
•	Suspension
•	Funding freeze
•	Audit
•	Bond execution
•	Removal from program
1.6 Money Movement Rules
Normal Procurement
•	Approved by Program Director
•	Paid by Treasury
•	Dual sign required > $50,000
•	Receipt required
•	CLIN mapping required
RRPA Emergency Procurement
•	Justification required
•	Receipt required
•	Upload within 72 hours
•	Reviewed by Compliance
•	Approved by Program Director
Disbursement Rules
•	ACH only
•	No cash
•	No gift cards
•	No personal accounts
•	No unverified vendors
Financial Reporting
•	Weekly summary
•	Monthly ledger
•	Quarterly audit
1.7 Compliance Enforcement
Minor Violations
•	Warning
•	Retraining
•	30 day follow up
Moderate Violations
•	Suspension
•	Corrective action plan
•	60 day follow up
Major Violations
•	Bond execution
•	Agency removal
•	Criminal referral
