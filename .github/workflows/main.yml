4.4 Cultural Consent Protocol
Consent Requirements
Consent must be:
•	Informed
•	Voluntary
•	Culturally appropriate
•	Documented
•	Verified by Advocate
If elder cannot consent:
Advocate must:
•	Determine cultural appropriateness
•	Sign consent on elder’s behalf
•	Document justification
Cultural Liaison Required When:
•	Ceremonial items present
•	Cultural practices involved
•	Heritage knowledge involved
•	Tribal customs relevant
4.5 Mandatory Reporting Protocol
Mandatory reporting is required for:
•	Abuse
•	Neglect
•	Exploitation
•	Financial harm
•	Medical neglect
•	Cultural disrespect
•	Unsafe conditions
•	Emotional distress caused by responders
Mandatory Reporting Workflow
STEP 1 — Incident Identified
Responder identifies harm or risk.
STEP 2 — Immediate Safety
Advocate ensures elder safety.
STEP 3 — Report Submission
Agency submits:
•	Mandatory Reporting Form
•	Safety assessment
•	Witness statements (if applicable)
Upload deadline:
•	2 hours
STEP 4 — Compliance Review
Compliance reviews:
•	Severity
•	Evidence
•	Personnel involved
STEP 5 — Remediation
Actions may include:
•	Medical care
•	Emotional support
•	Cultural remediation
•	Personnel removal
STEP 6 — Audit Trigger
If harm confirmed:
•	Forensic audit initiated
