This is the accountability backbone of the FROGS Program.
7.1 Audit Types
The FROGS Program uses three audit types:
1. Quarterly Audit (Standard)
Performed every quarter.
Covers:
•	Procurement
•	Finance
•	Elder protection
•	Safety
•	Documentation
•	Credentialing
•	Complaint intake
2. Triggered Audit (Incident Based)
Initiated when specific conditions occur.
Triggers include:
•	Elder harm
•	Fraud
•	Misuse of funds
•	Unauthorized procurement
•	Data breach
•	Mandatory reporting failure
•	Safety violation
3. Forensic Audit (Severe)
Initiated when:
•	Harm is confirmed
•	Fraud is suspected
•	Criminal activity is possible
•	Bond execution is likely
Forensic audits are deep dive investigations with full access to:
•	Logs
•	Receipts
•	Communications
•	Personnel records
•	Vendor records
•	Financial records
7.2 Quarterly Audit Workflow (Step by Step)
STEP 1 — Notification
Compliance sends quarterly audit notice to:
•	Agency leadership
•	Procurement officer
•	Treasury liaison
•	Operations chief
STEP 2 — Document Collection
Agency uploads:
•	Procurement receipts
•	CLIN mapping
•	Ledger reconciliation
•	Elder protection documentation
•	Safety reports
•	Credentialing updates
•	Complaint logs
STEP 3 — Compliance Review
Compliance reviews:
•	Completeness
•	Accuracy
•	Timeliness
•	Legitimacy
STEP 4 — Findings Report
Compliance issues:
•	Audit findings
•	Risk score
•	Required corrections
STEP 5 — Corrective Action
Agency must:
•	Upload missing documents
•	Correct errors
•	Provide justification
•	Update procedures
STEP 6 — Follow Up
Compliance verifies corrections within:
•	30 days
