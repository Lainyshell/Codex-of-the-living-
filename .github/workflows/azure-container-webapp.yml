name: Release Treasury API

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: treasury-api-release
  cancel-in-progress: false

env:
  IMAGE_NAME: vbtn-treasury-api
  NULL_SHA: "0000000000000000000000000000000000000000"
  RATE_LATENCY_THRESHOLD_MS: "5000"

jobs:
  build:
    name: Build and Publish Container
    runs-on: ubuntu-latest
    outputs:
      image_ref: ${{ steps.meta.outputs.image_ref }}
      image_tag: ${{ steps.meta.outputs.image_tag }}
      previous_tag: ${{ steps.meta.outputs.previous_tag }}
      repo_lc: ${{ steps.meta.outputs.repo_lc }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare image metadata
        id: meta
        run: |
          OWNER_LC="${GITHUB_REPOSITORY_OWNER,,}"
          REPO_NAME_LC="${GITHUB_REPOSITORY#*/}"
          REPO_NAME_LC="${REPO_NAME_LC,,}"
          REPO_NAME_CLEANED="$(echo "${REPO_NAME_LC}" | sed -E 's/[^a-z0-9._-]+/-/g')"
          REPO_NAME_SANITIZED="$(echo "${REPO_NAME_CLEANED}" | sed -E 's/^[._-]+//; s/[._-]+$//')"
          REPO_LC="${OWNER_LC}/${REPO_NAME_SANITIZED}"
          IMAGE_TAG="${GITHUB_SHA}"
          IMAGE_REF="ghcr.io/${REPO_LC}/${{ env.IMAGE_NAME }}:${IMAGE_TAG}"
          # github.event.before can be empty/zero for first commits, manual runs, or force-push edges.
          # When invalid, rollback is intentionally skipped.
          PREVIOUS_TAG="${{ github.event.before }}"
          echo "repo_lc=${REPO_LC}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "image_ref=${IMAGE_REF}" >> "$GITHUB_OUTPUT"
          echo "previous_tag=${PREVIOUS_TAG}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          file: ./app/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image_ref }}
            ghcr.io/${{ steps.meta.outputs.repo_lc }}/${{ env.IMAGE_NAME }}:main-latest

      - name: Build telemetry
        run: |
          printf '%s\n' \
            '{' \
            "  \"stage\":\"build\"," \
            "  \"commit_sha\":\"${GITHUB_SHA}\"," \
            "  \"workflow_run_id\":\"${GITHUB_RUN_ID}\"," \
            "  \"image_ref\":\"${{ steps.meta.outputs.image_ref }}\"" \
            '}' > build-telemetry.json

      - name: Upload build telemetry
        uses: actions/upload-artifact@v4
        with:
          name: build-telemetry
          path: build-telemetry.json

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: staging
      url: ${{ steps.deploy.outputs.webapp-url }}
    steps:
      - name: Validate staging deployment credentials
        env:
          APP_NAME: ${{ vars.AZURE_WEBAPP_NAME_STAGING || vars.AZURE_WEBAPP_NAME }}
          PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_STAGING || secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
        run: |
          set -euo pipefail
          if [ -z "${APP_NAME}" ]; then
            echo "Missing required app name variable. Set AZURE_WEBAPP_NAME_STAGING (or AZURE_WEBAPP_NAME)."
            exit 1
          fi
          if [ -z "${PUBLISH_PROFILE}" ] && { [ -z "${AZURE_CREDENTIALS}" ] && { [ -z "${CLIENT_ID}" ] || [ -z "${TENANT_ID}" ] || [ -z "${SUBSCRIPTION_ID}" ]; }; }; then
            echo "Missing Azure deploy credentials. Configure AZURE_WEBAPP_PUBLISH_PROFILE_STAGING/AZURE_WEBAPP_PUBLISH_PROFILE, or AZURE_CREDENTIALS, or AZURE_CLIENT_ID + AZURE_TENANT_ID + AZURE_SUBSCRIPTION_ID."
            exit 1
          fi

      - name: Azure login (service principal JSON)
        if: ${{ (secrets.AZURE_WEBAPP_PUBLISH_PROFILE_STAGING == '' && secrets.AZURE_WEBAPP_PUBLISH_PROFILE == '') && secrets.AZURE_CREDENTIALS != '' }}
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Azure login (OIDC)
        if: ${{ (secrets.AZURE_WEBAPP_PUBLISH_PROFILE_STAGING == '' && secrets.AZURE_WEBAPP_PUBLISH_PROFILE == '') && secrets.AZURE_CREDENTIALS == '' && secrets.AZURE_CLIENT_ID != '' && secrets.AZURE_TENANT_ID != '' && secrets.AZURE_SUBSCRIPTION_ID != '' }}
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy staging image
        id: deploy
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME_STAGING || vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_STAGING || secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          images: ${{ needs.build.outputs.image_ref }}

      - name: Staging smoke test (/ and /rates)
        env:
          BASE_URL: ${{ steps.deploy.outputs.webapp-url }}
        run: |
          set -euo pipefail
          URL="${BASE_URL:-https://${{ vars.AZURE_WEBAPP_NAME_STAGING || vars.AZURE_WEBAPP_NAME }}.azurewebsites.net}"

          STATUS_BODY=$(curl -fsS "${URL}/")
          python - <<'PY' "$STATUS_BODY"
          import json, sys
          payload = json.loads(sys.argv[1])
          if payload.get("status") != "ok":
              raise SystemExit("status endpoint did not return {\"status\":\"ok\"}")
          PY

          START_MS=$(date +%s%3N)
          RATES_BODY=$(curl -fsS "${URL}/rates")
          END_MS=$(date +%s%3N)
          DURATION_MS=$((END_MS - START_MS))
          python - <<'PY' "$RATES_BODY"
          import json, sys
          payload = json.loads(sys.argv[1])
          if "data" not in payload:
              raise SystemExit("/rates response missing `data` field")
          PY

          if [ "$DURATION_MS" -gt "${{ env.RATE_LATENCY_THRESHOLD_MS }}" ]; then
            echo "Staging /rates latency too high: ${DURATION_MS}ms"
            exit 1
          fi

          printf '%s\n' \
            '{' \
            "  \"stage\":\"staging_smoke\"," \
            "  \"commit_sha\":\"${GITHUB_SHA}\"," \
            "  \"workflow_run_id\":\"${GITHUB_RUN_ID}\"," \
            "  \"url\":\"${URL}\"," \
            "  \"rates_latency_ms\":${DURATION_MS}" \
            '}'

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build, deploy-staging]
    environment:
      name: production
      url: ${{ steps.deploy.outputs.webapp-url }}
    steps:
      - name: Validate production deployment credentials
        env:
          APP_NAME: ${{ vars.AZURE_WEBAPP_NAME_PRODUCTION || vars.AZURE_WEBAPP_NAME }}
          PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_PRODUCTION || secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
        run: |
          set -euo pipefail
          if [ -z "${APP_NAME}" ]; then
            echo "Missing required app name variable. Set AZURE_WEBAPP_NAME_PRODUCTION (or AZURE_WEBAPP_NAME)."
            exit 1
          fi
          if [ -z "${PUBLISH_PROFILE}" ] && { [ -z "${AZURE_CREDENTIALS}" ] && { [ -z "${CLIENT_ID}" ] || [ -z "${TENANT_ID}" ] || [ -z "${SUBSCRIPTION_ID}" ]; }; }; then
            echo "Missing Azure deploy credentials. Configure AZURE_WEBAPP_PUBLISH_PROFILE_PRODUCTION/AZURE_WEBAPP_PUBLISH_PROFILE, or AZURE_CREDENTIALS, or AZURE_CLIENT_ID + AZURE_TENANT_ID + AZURE_SUBSCRIPTION_ID."
            exit 1
          fi

      - name: Azure login (service principal JSON)
        if: ${{ (secrets.AZURE_WEBAPP_PUBLISH_PROFILE_PRODUCTION == '' && secrets.AZURE_WEBAPP_PUBLISH_PROFILE == '') && secrets.AZURE_CREDENTIALS != '' }}
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Azure login (OIDC)
        if: ${{ (secrets.AZURE_WEBAPP_PUBLISH_PROFILE_PRODUCTION == '' && secrets.AZURE_WEBAPP_PUBLISH_PROFILE == '') && secrets.AZURE_CREDENTIALS == '' && secrets.AZURE_CLIENT_ID != '' && secrets.AZURE_TENANT_ID != '' && secrets.AZURE_SUBSCRIPTION_ID != '' }}
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy production image
        id: deploy
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME_PRODUCTION || vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_PRODUCTION || secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          images: ${{ needs.build.outputs.image_ref }}

      - name: Production smoke test (/ and /rates)
        id: smoke
        continue-on-error: true
        env:
          BASE_URL: ${{ steps.deploy.outputs.webapp-url }}
        run: |
          set -euo pipefail
          URL="${BASE_URL:-https://${{ vars.AZURE_WEBAPP_NAME_PRODUCTION || vars.AZURE_WEBAPP_NAME }}.azurewebsites.net}"

          STATUS_BODY=$(curl -fsS "${URL}/")
          python - <<'PY' "$STATUS_BODY"
          import json, sys
          payload = json.loads(sys.argv[1])
          if payload.get("status") != "ok":
              raise SystemExit("status endpoint did not return {\"status\":\"ok\"}")
          PY

          START_MS=$(date +%s%3N)
          RATES_BODY=$(curl -fsS "${URL}/rates")
          END_MS=$(date +%s%3N)
          DURATION_MS=$((END_MS - START_MS))
          python - <<'PY' "$RATES_BODY"
          import json, sys
          payload = json.loads(sys.argv[1])
          if "data" not in payload:
              raise SystemExit("/rates response missing `data` field")
          PY

          if [ "$DURATION_MS" -gt "${{ env.RATE_LATENCY_THRESHOLD_MS }}" ]; then
            echo "Production /rates latency too high: ${DURATION_MS}ms"
            exit 1
          fi

          printf '%s\n' \
            '{' \
            "  \"stage\":\"production_smoke\"," \
            "  \"commit_sha\":\"${GITHUB_SHA}\"," \
            "  \"workflow_run_id\":\"${GITHUB_RUN_ID}\"," \
            "  \"url\":\"${URL}\"," \
            "  \"rates_latency_ms\":${DURATION_MS}" \
            '}'

      - name: Validate rollback tag
        id: rollback_tag
        run: |
          TAG="${{ needs.build.outputs.previous_tag }}"
          if echo "$TAG" | grep -Eq '^[0-9a-f]{40}$' && [ "$TAG" != "${{ env.NULL_SHA }}" ]; then
            echo "is_valid=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_valid=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Roll back to previous image tag
        if: steps.smoke.outcome == 'failure' && steps.rollback_tag.outputs.is_valid == 'true'
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME_PRODUCTION || vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_PRODUCTION || secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          images: ghcr.io/${{ needs.build.outputs.repo_lc }}/${{ env.IMAGE_NAME }}:${{ needs.build.outputs.previous_tag }}

      - name: Fail workflow when production smoke test fails
        if: steps.smoke.outcome == 'failure'
        run: |
          echo "Production smoke test failed. Rollback attempted using previous image tag."
          exit 1
