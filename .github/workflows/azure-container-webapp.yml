name: Release Treasury API

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: treasury-api-release
  cancel-in-progress: false

env:
  AZURE_CLOUD: AzureUSGovernment
  DEFAULT_WEBAPP_HOSTNAME_SUFFIX: azurewebsites.us
  IMAGE_NAME: vbtn-treasury-api
  NULL_SHA: "0000000000000000000000000000000000000000"
  RATE_LATENCY_THRESHOLD_MS: "5000"

jobs:
  build:
    name: Build and Publish Container
    runs-on: ubuntu-latest
    outputs:
      image_ref: ${{ steps.meta.outputs.image_ref }}
      image_tag: ${{ steps.meta.outputs.image_tag }}
      previous_tag: ${{ steps.meta.outputs.previous_tag }}
      repo_lc: ${{ steps.meta.outputs.repo_lc }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare image metadata
        id: meta
        run: |
          OWNER_LC="${GITHUB_REPOSITORY_OWNER,,}"
          REPO_NAME_LC="${GITHUB_REPOSITORY#*/}"
          REPO_NAME_LC="${REPO_NAME_LC,,}"
          REPO_NAME_CLEANED="$(echo "${REPO_NAME_LC}" | sed -E 's/[^a-z0-9._-]+/-/g')"
          REPO_NAME_SANITIZED="$(echo "${REPO_NAME_CLEANED}" | sed -E 's/^[._-]+//; s/[._-]+$//')"
          REPO_LC="${OWNER_LC}/${REPO_NAME_SANITIZED}"
          IMAGE_TAG="${GITHUB_SHA}"
          IMAGE_REF="ghcr.io/${REPO_LC}/${{ env.IMAGE_NAME }}:${IMAGE_TAG}"
          # github.event.before can be empty/zero for first commits, manual runs, or force-push edges.
          # When invalid, rollback is intentionally skipped.
          PREVIOUS_TAG="${{ github.event.before }}"
          echo "repo_lc=${REPO_LC}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "image_ref=${IMAGE_REF}" >> "$GITHUB_OUTPUT"
          echo "previous_tag=${PREVIOUS_TAG}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          file: ./app/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image_ref }}
            ghcr.io/${{ steps.meta.outputs.repo_lc }}/${{ env.IMAGE_NAME }}:main-latest

      - name: Build telemetry
        run: |
          printf '%s\n' \
            '{' \
            "  \"stage\":\"build\"," \
            "  \"commit_sha\":\"${GITHUB_SHA}\"," \
            "  \"workflow_run_id\":\"${GITHUB_RUN_ID}\"," \
            "  \"image_ref\":\"${{ steps.meta.outputs.image_ref }}\"" \
            '}' > build-telemetry.json

      - name: Upload build telemetry
        uses: actions/upload-artifact@v4
        with:
          name: build-telemetry
          path: build-telemetry.json

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: staging
      url: ${{ steps.deploy_metadata.outputs.webapp_url }}
    steps:
      - name: Validate staging deployment configuration
        id: staging_auth
        env:
          APP_NAME: ${{ vars.AZURE_WEBAPP_NAME_STAGING || vars.AZURE_WEBAPP_NAME }}
          APP_NAME_SECRET_NAME: ${{ vars.AZURE_WEBAPP_NAME_STAGING_SECRET_NAME || vars.AZURE_WEBAPP_NAME_SECRET_NAME }}
          KEY_VAULT_NAME: ${{ vars.AZURE_KEY_VAULT_NAME }}
          PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_STAGING || secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          PUBLISH_PROFILE_SECRET_NAME: ${{ vars.AZURE_WEBAPP_PUBLISH_PROFILE_STAGING_SECRET_NAME || vars.AZURE_WEBAPP_PUBLISH_PROFILE_SECRET_NAME }}
          CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
        run: |
          set -euo pipefail
          HAS_OIDC_LOGIN=false
          HAS_AZURE_LOGIN=false
          if [ -n "${CLIENT_ID}" ] && [ -n "${TENANT_ID}" ] && [ -n "${SUBSCRIPTION_ID}" ]; then
            HAS_OIDC_LOGIN=true
            HAS_AZURE_LOGIN=true
          elif [ -n "${AZURE_CREDENTIALS}" ]; then
            HAS_AZURE_LOGIN=true
          fi
          AUTH_MODE=""
          if [ "${HAS_OIDC_LOGIN}" = "true" ]; then
            AUTH_MODE="oidc"
          elif [ -n "${AZURE_CREDENTIALS}" ]; then
            AUTH_MODE="service-principal-json"
          elif [ -n "${PUBLISH_PROFILE}" ]; then
            AUTH_MODE="publish-profile"
          fi
          if [ -z "${AUTH_MODE}" ]; then
            echo "Missing Azure deploy credentials. Configure AZURE_CLIENT_ID + AZURE_TENANT_ID + AZURE_SUBSCRIPTION_ID, or AZURE_CREDENTIALS, or AZURE_WEBAPP_PUBLISH_PROFILE_STAGING/AZURE_WEBAPP_PUBLISH_PROFILE."
            exit 1
          fi
          if [ -z "${APP_NAME}" ] && [ -z "${APP_NAME_SECRET_NAME}" ]; then
            echo "Missing staging app name. Set AZURE_WEBAPP_NAME_STAGING/AZURE_WEBAPP_NAME or configure AZURE_WEBAPP_NAME_STAGING_SECRET_NAME/AZURE_WEBAPP_NAME_SECRET_NAME."
            exit 1
          fi
          if [ -z "${KEY_VAULT_NAME}" ] && { [ -n "${APP_NAME_SECRET_NAME}" ] || [ -n "${PUBLISH_PROFILE_SECRET_NAME}" ]; }; then
            echo "Azure Key Vault secret names were configured without AZURE_KEY_VAULT_NAME."
            exit 1
          fi
          if [ -n "${KEY_VAULT_NAME}" ] && [ "${HAS_AZURE_LOGIN}" = "false" ] && { [ -n "${APP_NAME_SECRET_NAME}" ] || [ -n "${PUBLISH_PROFILE_SECRET_NAME}" ]; }; then
            echo "Azure Key Vault secret resolution requires OIDC or service principal login."
            exit 1
          fi
          echo "auth_mode=${AUTH_MODE}" >> "$GITHUB_OUTPUT"

      - name: Azure login (service principal JSON)
        if: ${{ steps.staging_auth.outputs.auth_mode == 'service-principal-json' }}
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
          environment: ${{ env.AZURE_CLOUD }}

      - name: Azure login (OIDC)
        if: ${{ steps.staging_auth.outputs.auth_mode == 'oidc' }}
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          environment: ${{ env.AZURE_CLOUD }}

      - name: Resolve staging deployment inputs
        id: staging_inputs
        env:
          APP_NAME: ${{ vars.AZURE_WEBAPP_NAME_STAGING || vars.AZURE_WEBAPP_NAME }}
          APP_NAME_SECRET_NAME: ${{ vars.AZURE_WEBAPP_NAME_STAGING_SECRET_NAME || vars.AZURE_WEBAPP_NAME_SECRET_NAME }}
          KEY_VAULT_NAME: ${{ vars.AZURE_KEY_VAULT_NAME }}
          PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_STAGING || secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          PUBLISH_PROFILE_SECRET_NAME: ${{ vars.AZURE_WEBAPP_PUBLISH_PROFILE_STAGING_SECRET_NAME || vars.AZURE_WEBAPP_PUBLISH_PROFILE_SECRET_NAME }}
        run: |
          set -euo pipefail
          APP_NAME_RESOLVED="${APP_NAME}"
          PUBLISH_PROFILE_RESOLVED="${PUBLISH_PROFILE}"

          if [ -n "${KEY_VAULT_NAME}" ] && [ "${{ steps.staging_auth.outputs.auth_mode }}" != "publish-profile" ]; then
            az cloud set --name "${{ env.AZURE_CLOUD }}"
            if [ -n "${APP_NAME_SECRET_NAME}" ]; then
              APP_NAME_RESOLVED="$(az keyvault secret show --vault-name "${KEY_VAULT_NAME}" --name "${APP_NAME_SECRET_NAME}" --query value -o tsv)"
            fi
            if [ -n "${PUBLISH_PROFILE_SECRET_NAME}" ]; then
              PUBLISH_PROFILE_RESOLVED="$(az keyvault secret show --vault-name "${KEY_VAULT_NAME}" --name "${PUBLISH_PROFILE_SECRET_NAME}" --query value -o tsv)"
            fi
          fi

          if [ -z "${APP_NAME_RESOLVED}" ]; then
            echo "Unable to resolve staging app name."
            exit 1
          fi

          if [ -n "${PUBLISH_PROFILE_RESOLVED}" ]; then
            echo "::add-mask::${PUBLISH_PROFILE_RESOLVED}"
          fi

          echo "app_name=${APP_NAME_RESOLVED}" >> "$GITHUB_OUTPUT"
          if [ -n "${PUBLISH_PROFILE_RESOLVED}" ]; then
            echo "publish_profile_present=true" >> "$GITHUB_OUTPUT"
            {
              echo "publish_profile<<EOF"
              printf '%s\n' "${PUBLISH_PROFILE_RESOLVED}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "publish_profile_present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy staging image (Azure login)
        if: ${{ steps.staging_auth.outputs.auth_mode != 'publish-profile' }}
        id: deploy_login
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ steps.staging_inputs.outputs.app_name }}
          images: ${{ needs.build.outputs.image_ref }}

      - name: Deploy staging image (publish profile)
        if: ${{ steps.staging_auth.outputs.auth_mode == 'publish-profile' }}
        id: deploy_publish_profile
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ steps.staging_inputs.outputs.app_name }}
          publish-profile: ${{ steps.staging_inputs.outputs.publish_profile }}
          images: ${{ needs.build.outputs.image_ref }}

      - name: Capture staging deployment metadata
        id: deploy_metadata
        run: |
          echo "webapp_url=${{ steps.deploy_login.outputs.webapp-url || steps.deploy_publish_profile.outputs.webapp-url }}" >> "$GITHUB_OUTPUT"

      - name: Staging smoke test (/ and /rates)
        env:
          BASE_URL: ${{ steps.deploy_metadata.outputs.webapp_url }}
          APP_NAME: ${{ steps.staging_inputs.outputs.app_name }}
          DEFAULT_HOSTNAME_SUFFIX: ${{ vars.AZURE_WEBAPP_DEFAULT_HOSTNAME_SUFFIX || env.DEFAULT_WEBAPP_HOSTNAME_SUFFIX }}
        run: |
          set -euo pipefail
          URL="${BASE_URL:-https://${APP_NAME}.${DEFAULT_HOSTNAME_SUFFIX}}"

          STATUS_BODY=$(curl -fsS "${URL}/")
          python - <<'PY' "$STATUS_BODY"
          import json, sys
          payload = json.loads(sys.argv[1])
          if payload.get("status") != "ok":
              raise SystemExit("status endpoint did not return {\"status\":\"ok\"}")
          PY

          START_MS=$(date +%s%3N)
          RATES_BODY=$(curl -fsS "${URL}/rates")
          END_MS=$(date +%s%3N)
          DURATION_MS=$((END_MS - START_MS))
          python - <<'PY' "$RATES_BODY"
          import json, sys
          payload = json.loads(sys.argv[1])
          if "data" not in payload:
              raise SystemExit("/rates response missing `data` field")
          PY

          if [ "$DURATION_MS" -gt "${{ env.RATE_LATENCY_THRESHOLD_MS }}" ]; then
            echo "Staging /rates latency too high: ${DURATION_MS}ms"
            exit 1
          fi

          printf '%s\n' \
            '{' \
            "  \"stage\":\"staging_smoke\"," \
            "  \"commit_sha\":\"${GITHUB_SHA}\"," \
            "  \"workflow_run_id\":\"${GITHUB_RUN_ID}\"," \
            "  \"url\":\"${URL}\"," \
            "  \"rates_latency_ms\":${DURATION_MS}" \
            '}'

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build, deploy-staging]
    environment:
      name: production
      url: ${{ steps.deploy_metadata.outputs.webapp_url }}
    steps:
      - name: Validate production deployment configuration
        id: production_auth
        env:
          APP_NAME: ${{ vars.AZURE_WEBAPP_NAME_PRODUCTION || vars.AZURE_WEBAPP_NAME }}
          APP_NAME_SECRET_NAME: ${{ vars.AZURE_WEBAPP_NAME_PRODUCTION_SECRET_NAME || vars.AZURE_WEBAPP_NAME_SECRET_NAME }}
          KEY_VAULT_NAME: ${{ vars.AZURE_KEY_VAULT_NAME }}
          PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_PRODUCTION || secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          PUBLISH_PROFILE_SECRET_NAME: ${{ vars.AZURE_WEBAPP_PUBLISH_PROFILE_PRODUCTION_SECRET_NAME || vars.AZURE_WEBAPP_PUBLISH_PROFILE_SECRET_NAME }}
          CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
        run: |
          set -euo pipefail
          HAS_OIDC_LOGIN=false
          HAS_AZURE_LOGIN=false
          if [ -n "${CLIENT_ID}" ] && [ -n "${TENANT_ID}" ] && [ -n "${SUBSCRIPTION_ID}" ]; then
            HAS_OIDC_LOGIN=true
            HAS_AZURE_LOGIN=true
          elif [ -n "${AZURE_CREDENTIALS}" ]; then
            HAS_AZURE_LOGIN=true
          fi
          AUTH_MODE=""
          if [ "${HAS_OIDC_LOGIN}" = "true" ]; then
            AUTH_MODE="oidc"
          elif [ -n "${AZURE_CREDENTIALS}" ]; then
            AUTH_MODE="service-principal-json"
          elif [ -n "${PUBLISH_PROFILE}" ]; then
            AUTH_MODE="publish-profile"
          fi
          if [ -z "${AUTH_MODE}" ]; then
            echo "Missing Azure deploy credentials. Configure AZURE_CLIENT_ID + AZURE_TENANT_ID + AZURE_SUBSCRIPTION_ID, or AZURE_CREDENTIALS, or AZURE_WEBAPP_PUBLISH_PROFILE_PRODUCTION/AZURE_WEBAPP_PUBLISH_PROFILE."
            exit 1
          fi
          if [ -z "${APP_NAME}" ] && [ -z "${APP_NAME_SECRET_NAME}" ]; then
            echo "Missing production app name. Set AZURE_WEBAPP_NAME_PRODUCTION/AZURE_WEBAPP_NAME or configure AZURE_WEBAPP_NAME_PRODUCTION_SECRET_NAME/AZURE_WEBAPP_NAME_SECRET_NAME."
            exit 1
          fi
          if [ -z "${KEY_VAULT_NAME}" ] && { [ -n "${APP_NAME_SECRET_NAME}" ] || [ -n "${PUBLISH_PROFILE_SECRET_NAME}" ]; }; then
            echo "Azure Key Vault secret names were configured without AZURE_KEY_VAULT_NAME."
            exit 1
          fi
          if [ -n "${KEY_VAULT_NAME}" ] && [ "${HAS_AZURE_LOGIN}" = "false" ] && { [ -n "${APP_NAME_SECRET_NAME}" ] || [ -n "${PUBLISH_PROFILE_SECRET_NAME}" ]; }; then
            echo "Azure Key Vault secret resolution requires OIDC or service principal login."
            exit 1
          fi
          echo "auth_mode=${AUTH_MODE}" >> "$GITHUB_OUTPUT"

      - name: Azure login (service principal JSON)
        if: ${{ steps.production_auth.outputs.auth_mode == 'service-principal-json' }}
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
          environment: ${{ env.AZURE_CLOUD }}

      - name: Azure login (OIDC)
        if: ${{ steps.production_auth.outputs.auth_mode == 'oidc' }}
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          environment: ${{ env.AZURE_CLOUD }}

      - name: Resolve production deployment inputs
        id: production_inputs
        env:
          APP_NAME: ${{ vars.AZURE_WEBAPP_NAME_PRODUCTION || vars.AZURE_WEBAPP_NAME }}
          APP_NAME_SECRET_NAME: ${{ vars.AZURE_WEBAPP_NAME_PRODUCTION_SECRET_NAME || vars.AZURE_WEBAPP_NAME_SECRET_NAME }}
          KEY_VAULT_NAME: ${{ vars.AZURE_KEY_VAULT_NAME }}
          PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_PRODUCTION || secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          PUBLISH_PROFILE_SECRET_NAME: ${{ vars.AZURE_WEBAPP_PUBLISH_PROFILE_PRODUCTION_SECRET_NAME || vars.AZURE_WEBAPP_PUBLISH_PROFILE_SECRET_NAME }}
        run: |
          set -euo pipefail
          APP_NAME_RESOLVED="${APP_NAME}"
          PUBLISH_PROFILE_RESOLVED="${PUBLISH_PROFILE}"

          if [ -n "${KEY_VAULT_NAME}" ] && [ "${{ steps.production_auth.outputs.auth_mode }}" != "publish-profile" ]; then
            az cloud set --name "${{ env.AZURE_CLOUD }}"
            if [ -n "${APP_NAME_SECRET_NAME}" ]; then
              APP_NAME_RESOLVED="$(az keyvault secret show --vault-name "${KEY_VAULT_NAME}" --name "${APP_NAME_SECRET_NAME}" --query value -o tsv)"
            fi
            if [ -n "${PUBLISH_PROFILE_SECRET_NAME}" ]; then
              PUBLISH_PROFILE_RESOLVED="$(az keyvault secret show --vault-name "${KEY_VAULT_NAME}" --name "${PUBLISH_PROFILE_SECRET_NAME}" --query value -o tsv)"
            fi
          fi

          if [ -z "${APP_NAME_RESOLVED}" ]; then
            echo "Unable to resolve production app name."
            exit 1
          fi

          if [ -n "${PUBLISH_PROFILE_RESOLVED}" ]; then
            echo "::add-mask::${PUBLISH_PROFILE_RESOLVED}"
          fi

          echo "app_name=${APP_NAME_RESOLVED}" >> "$GITHUB_OUTPUT"
          if [ -n "${PUBLISH_PROFILE_RESOLVED}" ]; then
            echo "publish_profile_present=true" >> "$GITHUB_OUTPUT"
            {
              echo "publish_profile<<EOF"
              printf '%s\n' "${PUBLISH_PROFILE_RESOLVED}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "publish_profile_present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy production image (Azure login)
        if: ${{ steps.production_auth.outputs.auth_mode != 'publish-profile' }}
        id: deploy_login
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ steps.production_inputs.outputs.app_name }}
          images: ${{ needs.build.outputs.image_ref }}

      - name: Deploy production image (publish profile)
        if: ${{ steps.production_auth.outputs.auth_mode == 'publish-profile' }}
        id: deploy_publish_profile
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ steps.production_inputs.outputs.app_name }}
          publish-profile: ${{ steps.production_inputs.outputs.publish_profile }}
          images: ${{ needs.build.outputs.image_ref }}

      - name: Capture production deployment metadata
        id: deploy_metadata
        run: |
          echo "webapp_url=${{ steps.deploy_login.outputs.webapp-url || steps.deploy_publish_profile.outputs.webapp-url }}" >> "$GITHUB_OUTPUT"

      - name: Production smoke test (/ and /rates)
        id: smoke
        continue-on-error: true
        env:
          BASE_URL: ${{ steps.deploy_metadata.outputs.webapp_url }}
          APP_NAME: ${{ steps.production_inputs.outputs.app_name }}
          DEFAULT_HOSTNAME_SUFFIX: ${{ vars.AZURE_WEBAPP_DEFAULT_HOSTNAME_SUFFIX || env.DEFAULT_WEBAPP_HOSTNAME_SUFFIX }}
        run: |
          set -euo pipefail
          URL="${BASE_URL:-https://${APP_NAME}.${DEFAULT_HOSTNAME_SUFFIX}}"

          STATUS_BODY=$(curl -fsS "${URL}/")
          python - <<'PY' "$STATUS_BODY"
          import json, sys
          payload = json.loads(sys.argv[1])
          if payload.get("status") != "ok":
              raise SystemExit("status endpoint did not return {\"status\":\"ok\"}")
          PY

          START_MS=$(date +%s%3N)
          RATES_BODY=$(curl -fsS "${URL}/rates")
          END_MS=$(date +%s%3N)
          DURATION_MS=$((END_MS - START_MS))
          python - <<'PY' "$RATES_BODY"
          import json, sys
          payload = json.loads(sys.argv[1])
          if "data" not in payload:
              raise SystemExit("/rates response missing `data` field")
          PY

          if [ "$DURATION_MS" -gt "${{ env.RATE_LATENCY_THRESHOLD_MS }}" ]; then
            echo "Production /rates latency too high: ${DURATION_MS}ms"
            exit 1
          fi

          printf '%s\n' \
            '{' \
            "  \"stage\":\"production_smoke\"," \
            "  \"commit_sha\":\"${GITHUB_SHA}\"," \
            "  \"workflow_run_id\":\"${GITHUB_RUN_ID}\"," \
            "  \"url\":\"${URL}\"," \
            "  \"rates_latency_ms\":${DURATION_MS}" \
            '}'

      - name: Validate rollback tag
        id: rollback_tag
        run: |
          TAG="${{ needs.build.outputs.previous_tag }}"
          if echo "$TAG" | grep -Eq '^[0-9a-f]{40}$' && [ "$TAG" != "${{ env.NULL_SHA }}" ]; then
            echo "is_valid=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_valid=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Roll back to previous image tag (Azure login)
        if: steps.smoke.outcome == 'failure' && steps.rollback_tag.outputs.is_valid == 'true' && steps.production_auth.outputs.auth_mode != 'publish-profile'
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ steps.production_inputs.outputs.app_name }}
          images: ghcr.io/${{ needs.build.outputs.repo_lc }}/${{ env.IMAGE_NAME }}:${{ needs.build.outputs.previous_tag }}

      - name: Roll back to previous image tag (publish profile)
        if: steps.smoke.outcome == 'failure' && steps.rollback_tag.outputs.is_valid == 'true' && steps.production_auth.outputs.auth_mode == 'publish-profile'
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ steps.production_inputs.outputs.app_name }}
          publish-profile: ${{ steps.production_inputs.outputs.publish_profile }}
          images: ghcr.io/${{ needs.build.outputs.repo_lc }}/${{ env.IMAGE_NAME }}:${{ needs.build.outputs.previous_tag }}

      - name: Fail workflow when production smoke test fails
        if: steps.smoke.outcome == 'failure'
        run: |
          echo "Production smoke test failed. Rollback attempted using previous image tag."
          exit 1
